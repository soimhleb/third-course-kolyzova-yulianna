<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ЦДА и Брезенхем</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Растеризация отрезка</h1>

  <div class="controls">
    <label>x1 <input type="number" id="x1" value="2"></label>
    <label>y1 <input type="number" id="y1" value="2"></label>
    <label>x2 <input type="number" id="x2" value="20"></label>
    <label>y2 <input type="number" id="y2" value="8"></label>
    <button id="build">Построить</button>
  </div>

  <div class="controls">
    <span>Алгоритм:</span>
    <label><input type="radio" name="algo" value="dda" checked> ЦДА</label>
    <label><input type="radio" name="algo" value="bresenham"> Брезенхем</label>
  </div>

  <canvas id="canvas" width="600" height="450"></canvas>

  <div class="columns">
    <section>
      <h2>Пиксели</h2>
      <ul id="pixels"></ul>
    </section>

    <section>
      <h2>Шаги Брезенхема</h2>
      <table id="steps">
        <thead>
          <tr>
            <th>шаг</th>
            <th>x</th>
            <th>y</th>
            <th>error</th>
            <th>error2</th>
            <th>Δx</th>
            <th>Δy</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <h2>Сравнение ЦДА и Брезенхема</h2>
  <button id="compare">Сравнить текущий отрезок</button>
  <div id="compareResult"></div>

  <h2>Замер скорости</h2>
  <button id="benchmark">Запустить (10000 случайных отрезков × 5 прогонов)</button>
  <pre id="benchmarkResult"></pre>

  <script src="app.js"></script>
</body>
</html>
