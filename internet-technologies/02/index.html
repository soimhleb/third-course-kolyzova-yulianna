<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анализатор чисел</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Анализатор чисел</h1>

  <div class="controls">
    <input type="number" id="number" placeholder="Введите число">
    <button id="add">Добавить</button>
    <button id="removeLast">Удалить последнее</button>
    <button id="clear">Очистить</button>
  </div>

  <p id="error" class="error"></p>

  <h2>Числа</h2>
  <ul id="list"></ul>

  <h2>Статистика</h2>
  <ul id="stats"></ul>

  <script src="app.js"></script>
</body>
</html>
