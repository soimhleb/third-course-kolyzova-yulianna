<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мои книги</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Мои книги</h1>
    
    <!-- Форма создания -->
    <form id="book-form">
      <input type="text" id="title-input" placeholder="Название книги">
      <input type="text" id="author-input" placeholder="Автор">
      <button type="submit">Добавить</button>
    </form>

    <p id="message"></p>
    <button id="refresh-btn">Обновить список</button>
    
    <!-- Список книг -->
    <ul id="book-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
